name: Build and push Docker image

on:
  push:
    tags:
      - '**' # 仅在推送 tag 时构建并上传

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute image name and tag
        run: |
          # 仓库 owner/repo => Docker Hub 镜像 owner/repo(镜像名必须小写)
          IMAGE="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          # tag 中的 '/' 不是合法镜像 tag 字符,替换为 '-'
          TAG="$(echo '${{ github.ref_name }}' | sed 's|/|-|g')"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        run: echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin

      - name: Build image
        run: docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .

      - name: Push image
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
