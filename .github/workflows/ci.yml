name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - name: Smoke
        run: cargo run --release --locked -- --version

      - name: Clippy
        if: matrix.runs-on == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets -- -D warnings

  # 交叉编译 Android 单 ELF(adb shell 可执行,动态链接 bionic)
  build-android:
    runs-on: ubuntu-latest
    env:
      NDK: android-ndk-r27c
      TARGET: aarch64-linux-android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add Rust target
        run: rustup target add $TARGET

      - name: Install NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/${NDK}-linux.zip"
          sudo unzip -q /tmp/ndk.zip -d /opt

      - name: Build
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /opt/${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CC_aarch64_linux_android: /opt/${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: /opt/${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo build --release --locked --target $TARGET

      - name: Smoke
        run: file target/${TARGET}/release/rep | grep -q 'ELF 64-bit LSB.*ARM aarch64'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rep-android-aarch64
          path: target/${TARGET}/release/rep
          if-no-files-found: error
