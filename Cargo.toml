[package]
name = "rep"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
h2 = "0.4"
http = "1"
httparse = "1"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["std"] }
tokio = { version = "1", features = ["full"] }
# 与 rustls 一致只用 ring provider,避免默认特性拖入 aws-lc-rs(纯 C 依赖,交叉/Windows 构建困难)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.16"
# embed create:跨架构时从 GitHub Release 下载二进制(纯 Rust TLS + 解包 + 校验)
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# 减小二进制体积:strip 调试符号;thin LTO + 单 codegen unit 跨 crate 优化
# 不用 panic="abort"(代理进程需保持任务级 panic 隔离)与 opt-level="z"(吞吐优先)
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
